[project]
name = "qfx"
version = "0.1.0"
description = "QF-X volatility regime detection and risk-sizing system — validated components only"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
